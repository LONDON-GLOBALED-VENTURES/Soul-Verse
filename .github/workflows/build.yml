name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd frontend
          flutter build apk --release --dart-define=API_BASE_URL=https://soulverse-backend-469292499276.europe-west1.run.app

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulVerse-Android-Release-APK
          path: frontend/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    name: Build iOS (IPA & Simulator)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          cd frontend
          flutter pub get

      - name: Build iOS App (Device / Unsigned)
        run: |
          cd frontend
          flutter build ios --release --no-codesign --dart-define=API_BASE_URL=https://soulverse-backend-469292499276.europe-west1.run.app

      - name: Package Unsigned IPA for Sideloading
        run: |
          mkdir -p Payload
          cp -R frontend/build/ios/iphoneos/Runner.app Payload/
          zip -r SoulVerse-unsigned.ipa Payload

      - name: Upload Sideloadable IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoulVerse-iOS-Sideload-IPA
          path: SoulVerse-unsigned.ipa

      - name: Build iOS Simulator App
        run: |
          cd frontend
          flutter build ios --simulator --dart-define=API_BASE_URL=https://soulverse-backend-469292499276.europe-west1.run.app
          cd build/ios/iphonesimulator
          zip -r SoulVerse-Simulator.zip Runner.app

      - name: Upload iOS Simulator Zip (for Appetize.io)
        uses: actions/upload-artifact@v4
        with:
          name: SoulVerse-iOS-Simulator
          path: frontend/build/ios/iphonesimulator/SoulVerse-Simulator.zip
